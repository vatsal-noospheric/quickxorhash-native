[package]
name = "quickxorhash-native"
description = "Rust-backed QuickXorHash implementation with Python bindings."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
categories = ["algorithms"]
keywords = ["checksum", "digest", "hash", "quickxorhash"]

[lib]
name = "quickxorhash_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
pyo3 = { version = "0.23.5", features = ["abi3-py39"] }
sha1 = "0.10.6"

[dev-dependencies]
bencher = "0.1.5"

[[bench]]
name = "bench"
harness = false
