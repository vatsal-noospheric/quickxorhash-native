[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "quickxorhash-native"
description = "Rust-backed QuickXorHash and file-hash helpers for Python."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dynamic = ["version"]
license = "MIT OR Apache-2.0"
authors = [
	{ name = "Noospheric", email = "71_toluene.sketchy@icloud.com" },
]
keywords = ["checksum", "digest", "hash", "onedrive", "quickxorhash"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: Apache Software License",
	"License :: OSI Approved :: MIT License",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.14",
	"Programming Language :: Rust",
	"Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/vatsal-noospheric/quickxorhash-native"
Issues = "https://github.com/vatsal-noospheric/quickxorhash-native/issues"

[tool.maturin]
module-name = "quickxorhash_native"
features = ["pyo3/extension-module"]
include = [
	"quickxorhash_native.pyi",
	"py.typed",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PYI", "RUF", "UP"]

[tool.quickxorhash.release]
requires-python = ">=3.14,<3.15"
abi3-feature = "abi3-py314"
sdist = false

[tool.quickxorhash.release.targets.macos-arm64]
platform-tags = ["macosx_11_0_arm64"]

[tool.quickxorhash.release.targets.manylinux-aarch64]
platform-tags = ["manylinux_2_17_aarch64", "manylinux2014_aarch64"]

[dependency-groups]
dev = [
	"maturin>=1.14,<2.0",
	"pytest>=9.0.3",
	"ruff>=0.15.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
